# Feed-Schnappschuss vor dem täglichen Newsflash.
# Die Cloud-Routine (RemoteTrigger, 05:07 UTC) kann die Nachrichtenseiten
# nicht selbst abrufen (WebFetch für diese Domains gesperrt). Dieser Job holt
# die RSS-Feeds vorher ganz normal ab und committet feeds.md ins Repo.
# Hauptweg seit 24.10.2026: der Hub-Server sammelt um 04:40 UTC (systemd-Timer
# newsflash-feeds.timer, /usr/local/bin/newsflash-feeds.sh) und pusht feeds.md.
# Dieser Job ist nur noch Reserve: GitHub startet geplante Läufe teils Stunden
# zu spät (24.10.: 4,5 h; 26./27.10.: 01:17/03:17 erst ~06:15 UTC, knapp nach
# der Routine) -> Zeitplan am 27.10. entfernt, nur noch von Hand startbar
# (gh workflow run feeds.yml), falls der Server mal ausfällt.
name: Feeds sammeln

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Feeds abrufen
        run: node scripts/feeds-sammeln.mjs
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.md
          git diff --cached --quiet && exit 0
          git commit -m "Feeds $(date -u +%Y-%m-%d)"
          git pull --rebase -q
          git push
